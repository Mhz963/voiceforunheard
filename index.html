<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon1.png" />
    <link rel="apple-touch-icon" href="/icon1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VoiceForUnheard: A comprehensive speech education system for hearing impaired learners. Evidence based therapy, educator led programs, and family centered support."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-primary: #1a4d6d;
        --color-primary-dark: #0f3349;
        --color-accent: #e07a5f;
        --color-accent-light: #f4a261;
        --color-teal: #2a9d8f;
        --color-bg: #faf9f7;
        --color-surface: #ffffff;
        --color-text: #2d3436;
        --color-text-muted: #636e72;
        --color-border: #e8e4df;
        --font-body: 'DM Sans', system-ui, sans-serif;
        --font-display: 'Fraunces', Georgia, serif;
        --header-height: 92px;
        --container-max: 1200px;
        --radius-sm: 8px;
        --radius-md: 16px;
        --radius-lg: 24px;
        --space-sm: 1rem;
        --space-md: 1.5rem;
        --space-lg: 2rem;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--font-body);
        line-height: 1.7;
        color: var(--color-text);
        background: var(--color-bg);
      }
      a { color: var(--color-primary); text-decoration: none; }
      h1, h2, h3 { font-family: var(--font-display); color: var(--color-primary-dark); }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.875rem 1.75rem;
        font-weight: 600;
        border-radius: 100px;
        border: 2px solid transparent;
        text-decoration: none;
      }
      .btn--primary { background: var(--color-accent); color: #fff; }
      .btn--outline { background: transparent; color: var(--color-primary); border-color: var(--color-primary); }
      .btn--block { width: 100%; }
      .container {
        width: 100%;
        max-width: var(--container-max);
        margin: 0 auto;
        padding: 0 var(--space-md);
      }
      .section { padding: var(--space-lg) 0; }
      .section--compact { padding: var(--space-md) 0; }
      .page-hero {
        padding: calc(var(--header-height) + var(--space-lg)) 0 var(--space-lg);
        color: #fff;
      }
      .signin-hero {
        padding: calc(var(--header-height) + var(--space-xl)) 0 var(--space-lg);
        background: linear-gradient(145deg, var(--color-primary) 0%, #1e5a7a 45%, var(--color-teal) 100%);
        color: #fff;
        text-align: center;
      }
      .signin-hero h1 { color: #fff; }
      .signin-panel {
        max-width: 640px;
        margin: 0 auto;
        padding: var(--space-lg);
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        border: 1px solid var(--color-border);
      }
      .signin-form,
      .contact-form,
      .parent-portal__form {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
      }
      .signin-form label,
      .contact-form label,
      .parent-portal__form label {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        font-weight: 600;
        color: var(--color-primary);
      }
      .signin-form input,
      .contact-form input,
      .contact-form select,
      .contact-form textarea,
      .parent-portal__form input,
      .parent-portal__form select,
      .parent-portal__form textarea {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        font: inherit;
      }
      .parent-portal__form-row,
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-md);
      }
      @media (max-width: 768px) {
        .parent-portal__form-row,
        .form-row {
          grid-template-columns: 1fr;
        }
      }
      .header {
        position: fixed;
        inset: 0 0 auto;
        z-index: 1000;
        height: var(--header-height);
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid var(--color-border);
      }
      .hero {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--space-md);
        max-width: var(--container-max);
        margin: 0 auto;
        padding: calc(var(--header-height) + var(--space-md)) var(--space-md) var(--space-lg);
      }
      @media (min-width: 1025px) {
        .hero { grid-template-columns: 1fr 1fr; align-items: center; }
      }
    </style>
    <title>VoiceForUnheard | Speech Education for Hearing Impaired Learners</title>
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
