<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VoiceForUnheard: A comprehensive speech education system for hearing impaired learners. Evidence based therapy, educator led programs, and family centered support."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-primary: #1a4d6d;
        --color-primary-dark: #0f3349;
        --color-accent: #e07a5f;
        --color-accent-light: #f4a261;
        --color-teal: #2a9d8f;
        --color-bg: #faf9f7;
        --color-surface: #ffffff;
        --color-text: #2d3436;
        --color-text-muted: #636e72;
        --color-border: #e8e4df;
        --font-body: 'DM Sans', system-ui, sans-serif;
        --font-display: 'Fraunces', Georgia, serif;
        --header-height: 92px;
        --container-max: 1200px;
        --radius-sm: 8px;
        --radius-md: 16px;
        --radius-lg: 24px;
        --space-sm: 1rem;
        --space-md: 1.5rem;
        --space-lg: 2rem;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--font-body);
        line-height: 1.7;
        color: var(--color-text);
        background: var(--color-bg);
      }
      a { color: var(--color-primary); text-decoration: none; }
      h1, h2, h3 { font-family: var(--font-display); color: var(--color-primary-dark); }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.875rem 1.75rem;
        font-weight: 600;
        border-radius: 100px;
        border: 2px solid transparent;
        text-decoration: none;
      }
      .btn--primary { background: var(--color-accent); color: #fff; }
      .btn--outline { background: transparent; color: var(--color-primary); border-color: var(--color-primary); }
      .header {
        position: fixed;
        inset: 0 0 auto;
        z-index: 1000;
        height: var(--header-height);
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid var(--color-border);
      }
      .hero {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--space-md);
        max-width: var(--container-max);
        margin: 0 auto;
        padding: calc(var(--header-height) + var(--space-md)) var(--space-md) var(--space-lg);
      }
      @media (min-width: 1025px) {
        .hero { grid-template-columns: 1fr 1fr; align-items: center; }
      }
    </style>
    <title>VoiceForUnheard | Speech Education for Hearing Impaired Learners</title>
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
